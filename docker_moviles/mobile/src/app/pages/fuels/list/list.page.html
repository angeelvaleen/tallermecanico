<ion-header>
  <ion-toolbar>
    <ion-title>Combustibles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab slot="fixed" vertical="bottom" horizontal="center">
  <ion-fab-button (click)="createFuel()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let fuel of fuels">
      <ion-label class="ion-text-wrap">
        <h2>{{ fuel.name }}</h2>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/fuels/detail', fuel.id]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
      <ion-button slot="end" color="warning" (click)="abrirEditarModal(fuel.id)">
        <ion-icon name="pencil-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
