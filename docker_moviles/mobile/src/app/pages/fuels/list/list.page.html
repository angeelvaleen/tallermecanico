<ion-header>
  <ion-toolbar>
    <ion-title>Combustibles</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let fuel of fuels">
      <ion-label>
        <h2>{{ fuel.name }}</h2>
        <ion-button [routerLink]="['/fuels/detail', fuel.id]">
          <ion-icon name="eye-outline"></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
