<app-toolbar name="Combustibles" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createFuel()" aria-label="Nuevo combustible">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>



<ion-content>
  <ion-list>
    <ion-item *ngFor="let fuel of fuels">
      <ion-label class="ion-text-wrap">
        <h2>{{ fuel.name }}</h2>

        <p>
          Estado:
          {{ fuel.is_active ? 'Activo' : 'Inactivo' }}
        </p>

        <p>
          Registro:
          {{ fuel.created_at | date:'yyyy-MM-dd' }}
        </p>
      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editFuel(fuel.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
