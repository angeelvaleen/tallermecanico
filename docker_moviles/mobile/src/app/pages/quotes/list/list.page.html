<app-toolbar name="Cotizaciones" color="primary">
   <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createQuote()" aria-label="Nuevo couta">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>

<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar couta"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  <ion-list>
    <ion-item *ngFor="let quote of quotes">
      <ion-label>
        <h2>Cotizacion #{{ quote.id }}</h2>
        <p>Total: ${{ quote.total }}</p>
      </ion-label>
      <ion-button [routerLink]="['/quotes/detail',quote.id]">
        <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
