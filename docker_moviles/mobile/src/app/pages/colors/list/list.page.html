<app-toolbar name="Colores" color="dark"></app-toolbar>

<ion-fab
  slot="fixed"
  vertical="bottom"
  horizontal="end"
>
  <ion-fab-button (click)="createColor()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
   <ion-searchbar [value]="search" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar colores" aria-label="Buscar colores"></ion-searchbar>
    <p class="ion-padding" *ngIf="total === 0">No se encontraron colores.</p>
  <ion-list>
    <ion-item *ngFor="let color of colors">
      <ion-label class="ion-text-wrap">
        <h2>{{ color.name }}</h2>

        <p>
          Estado:
          {{ color.is_active ? 'Activo' : 'Inactivo' }}
        </p>

      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editColor(color.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
></app-pagination>
</ion-content>
