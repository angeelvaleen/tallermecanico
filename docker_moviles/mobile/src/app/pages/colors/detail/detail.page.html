<app-toolbar name="Detalle de Color" color="primary">
  <ion-buttons slot="start">
    <ion-back-button defaultHref="/colors/list"></ion-back-button>
  </ion-buttons>
</app-toolbar>

<ion-content class="ion-padding">
  <div *ngIf="color">
    <ion-card>
      <ion-card-content>
        <h2>Nombre: {{ color.name }}</h2>
        <p><strong>Estado:</strong> {{ color.is_active ? 'Activo' : 'Inactivo' }}</p>
        <p><strong>Registro:</strong> {{ color.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-card-content>
    </ion-card>
  </div>
  <div *ngIf="!color" class="ion-text-center">
    <p>Cargando informacion...</p>
  </div>
</ion-content>
