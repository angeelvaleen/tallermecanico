<app-toolbar name="Vehiculos" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createVehicle()" aria-label="Nuevo vehiculo">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>


<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar servicio"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  <ion-list>

    <ion-item *ngFor="let vehicle of vehicles">

      <ion-label>
        <h2>{{ vehicle.plate }}</h2>
      </ion-label>

      <!-- Detalle -->
      <ion-button
        slot="end"
        [routerLink]="['/vehicles/detail', vehicle.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        slot="end"
        color="warning"
        (click)="editVehicle(vehicle.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>

</ion-content>
