<app-toolbar name="Vehículos" color="primary">
  <ion-buttons slot="end">
    <ion-button *ngIf="canCreate" fill="primary" (click)="createVehicle()" aria-label="Nuevo vehículo">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>


<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar por placa o VIN"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>

  <div class="list-state" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando vehículos...</p>
  </div>

  <div class="list-state" *ngIf="!loading && loadError">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p>No se pudieron cargar los vehículos.</p>
    <ion-button fill="outline" (click)="retry()">Reintentar</ion-button>
  </div>

  <div class="list-state" *ngIf="!loading && !loadError && vehicles.length === 0">
    <ion-icon name="car-outline"></ion-icon>
    <p>
      {{ search ? 'No se encontraron vehículos para "' + search + '".' : 'No hay vehículos registrados.' }}
    </p>
  </div>

  <ion-list *ngIf="!loading && !loadError">

    <ion-item *ngFor="let vehicle of vehicles">

      <ion-label class="ion-text-wrap">
        <h2>{{ vehicle.plate }}</h2>
      </ion-label>

      <!-- Detalle -->
      <ion-button
        slot="end"
        fill="clear"
        [routerLink]="['/vehicles/detail', vehicle.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        *ngIf="canUpdate"
        (click)="editVehicle(vehicle.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
  <app-pagination
  *ngIf="!loading && !loadError && vehicles.length > 0"
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>

</ion-content>
