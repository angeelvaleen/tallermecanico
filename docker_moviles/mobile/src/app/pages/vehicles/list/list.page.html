<ion-header>
  <ion-toolbar>
    <ion-title>Vehiculos</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/vehicles/form">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let vehicle of vehicles">
      <ion-label>
        <h2>Placa: {{ vehicle.plate }}</h2>
        <p>Year: {{ vehicle.year }}</p>
      </ion-label>
      <ion-button [routerLink]="['/vehicles/detail', vehicle.id]" >
        <ion-icon name="eye-outline" ></ion-icon>
    </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
