<ion-header>
  <ion-toolbar>
    <ion-title>Vehiculos</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/vehicles/form">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let v of vehicles" [routerLink]="['/vehicles/detail', v.id]">
      <ion-label>
        <h2>Placa: {{ v.plate }}</h2>
        <p>Year: {{ v.year }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
