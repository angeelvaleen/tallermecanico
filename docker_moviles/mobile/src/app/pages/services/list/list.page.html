<app-toolbar name="Servicios" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createService()" aria-label="Nuevo servicio">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>


<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar servicio"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>

  <div class="list-state" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando servicios...</p>
  </div>

  <div class="list-state" *ngIf="!loading && loadError">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p>No se pudieron cargar los servicios.</p>
    <ion-button fill="outline" (click)="retry()">Reintentar</ion-button>
  </div>

  <div class="list-state" *ngIf="!loading && !loadError && services.length === 0">
    <ion-icon name="construct-outline"></ion-icon>
    <p>
      {{ search ? 'No se encontraron servicios para "' + search + '".' : 'No hay servicios registrados.' }}
    </p>
  </div>

  <ion-list *ngIf="!loading && !loadError">
    <ion-item *ngFor="let service of services">

      <ion-label class="ion-text-wrap">
        <h2>{{ service.name }}</h2>
      </ion-label>

      <ion-button
        slot="end"
        fill="clear"
        [routerLink]="['/services/detail', service.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        (click)="editService(service.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>
  <app-pagination
  *ngIf="!loading && !loadError && services.length > 0"
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
