<app-toolbar name="Servicios" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createService()" aria-label="Nuevo servicio">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>


<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar servicio"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  <ion-list>
    <ion-item *ngFor="let service of services">

      <ion-label class="ion-text-wrap">
        <h2>{{ service.name }}</h2>
      </ion-label>

      <ion-button
        slot="end"
        [routerLink]="['/services/detail', service.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <ion-button
        slot="end"
        color="warning"
        (click)="editService(service.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>
  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
