<ion-header>
  <ion-toolbar>
    <ion-title>Servicios</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let s of services">
      <ion-label>
        <h2>{{ s.name }}</h2>
        <p>Precio: ${{ s.price }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
