<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/services/list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Servicio</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-text color="danger" *ngIf="messageError" >
    <p class="ion-padding">{{ messageError }}</p>
  </ion-text>

  <div *ngIf="service">
    <ion-card>
      <ion-card-content>
        <h2>Nombre: {{ service.name }}</h2>
        <p><strong>ID:</strong> {{ service.id }}</p>
        <p><strong>Precio:</strong> ${{ service.price }}</p>
        <p><strong>Descripcion:</strong> {{ service.description || 'Sin descripcion' }}</p>
        <p>
          <ion-badge color="success" *ngIf="service.is_active">Activo</ion-badge>
          <ion-badge color="danger" *ngIf="!service.is_active">Inactivo</ion-badge>
        </p>
        <p><strong>Registro:</strong> {{ service.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<ion-footer *ngIf="service">
  <ion-toolbar>
    <ion-button expand="block" (click)="abrirPagina()">
      Ver respuesta de la API
    </ion-button>
  </ion-toolbar>
</ion-footer>
