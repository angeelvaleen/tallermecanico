<app-toolbar name="Detalle de Servicio" color="primary">
  <ion-buttons slot="start">
    <ion-back-button defaultHref="/services/list"></ion-back-button>
  </ion-buttons>
</app-toolbar>

<ion-content class="ion-padding">

  <ion-text
    color="danger"
    *ngIf="messageError"
  >
    <p class="ion-padding">
      {{ messageError }}
    </p>
  </ion-text>

  <div *ngIf="service">
    <ion-card>
      <ion-card-content>

        <h2>
          {{ service.name }}
        </h2>

        <p>
          <strong>Precio:</strong>
          ${{ service.price }}
        </p>

        <p>
          <strong>Descripción:</strong>
          {{ service.description || 'Sin descripción' }}
        </p>

        <p>
          <strong>Estado:</strong>
          {{ service.is_active ? 'Activo' : 'Inactivo' }}
        </p>

        <p>
          <strong>Registro:</strong>
          {{ service.created_at | date:'yyyy-MM-dd' }}
        </p>

      </ion-card-content>
    </ion-card>
  </div>

</ion-content>
