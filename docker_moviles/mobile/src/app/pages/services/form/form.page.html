<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button
        (click)="closeModal()"
        [disabled]="saved"
      >
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title>
      {{ isEdition ? 'Editar servicio' : 'Nuevo servicio' }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form
    *ngIf="serviceForm"
    [formGroup]="serviceForm"
    (ngSubmit)="saveService()"
  >

    <ion-list>

      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          type="text"
          formControlName="name"
          maxlength="100"
        ></ion-input>
      </ion-item>

      <ion-note
        color="danger"
        *ngIf="getError('name') as error"
      >
        {{ error }}
      </ion-note>


      <ion-item>
        <ion-input
          label="Precio"
          labelPlacement="stacked"
          type="number"
          formControlName="price"
          min="0"
          step="0.01"
        ></ion-input>
      </ion-item>

      <ion-note
        color="danger"
        *ngIf="getError('price') as error"
      >
        {{ error }}
      </ion-note>


      <ion-item>
        <ion-textarea
          label="Descripción"
          labelPlacement="stacked"
          formControlName="description"
          autoGrow="true"
        ></ion-textarea>
      </ion-item>

    </ion-list>

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="saved || loading"
    >
      {{
        saved
          ? 'Guardando...'
          : (isEdition ? 'Actualizar' : 'Guardar')
      }}
    </ion-button>

  </form>
</ion-content>
