<app-toolbar name="Detalle de usuario" color="primary">
<ion-buttons slot="start">
      <ion-button
        routerLink="/users/list"
        routerDirection="back"
        aria-label="Volver"
      >
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
<ion-buttons slot="end">
      <ion-button
        *ngIf="user"
        [routerLink]="['/users/form']"
        [queryParams]="{ id: user.id }"
        aria-label="Editar usuario"
      >
        <ion-icon slot="icon-only" name="pencil"></ion-icon>
      </ion-button>
    </ion-buttons>
</app-toolbar>

<ion-content [fullscreen]="true">
  <ion-spinner
    *ngIf="loading"
    name="crescent"
    class="ion-padding"
  ></ion-spinner>

  <ion-list *ngIf="!loading && user">
    <ion-item>
      <ion-label>
        <p>Nombre</p>
        <h2>{{ user.first_name ?? '—' }}</h2>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Apellido</p>
        <h2>{{ user.last_name ?? '—' }}</h2>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Correo</p>
        <h2>{{ user.email }}</h2>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Rol</p>
        <h2>{{ user.role?.name ?? 'Sin rol' }}</h2>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <p>Estado</p>
        <h2>{{ user.status ?? '—' }}</h2>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
