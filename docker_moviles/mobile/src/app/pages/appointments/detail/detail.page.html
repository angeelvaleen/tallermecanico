<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/appointments/list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Cita</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="appointment">
    <ion-card>
      <ion-card-content>
        <h2>Fecha: {{ appointment.date }}</h2>
        <p><strong>Hora:</strong> {{ appointment.time }}</p>
        <p><strong>Vehiculo ID:</strong> {{ appointment.vehicle_id }}</p>
        <p><strong>Estado ID:</strong> {{ appointment.status_id }}</p>
        <p><strong>Motivo:</strong> {{ appointment.reason || 'Sin motivo' }}</p>
        <p><strong>Registro:</strong> {{ appointment.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-card-content>
    </ion-card>
  </div>
  <div *ngIf="!appointment" class="ion-text-center">
    <p>Cargando informacion...</p>
  </div>
</ion-content>
