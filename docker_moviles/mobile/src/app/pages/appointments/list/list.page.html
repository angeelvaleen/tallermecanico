<app-toolbar name="Citas" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createAppointment()" aria-label="Nueva cita">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>

<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar servicio"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  
  <ion-list>

    <ion-item *ngFor="let item of appointments">

      <ion-label class="ion-text-wrap">

        <h2>
          {{ item.date }} - {{ item.time }}
        </h2>

        <p>
          Estado: {{ getStatusName(item.status_id) }}
        </p>

      </ion-label>

      <!-- Ver detalle -->
      <ion-button
        slot="end"
        fill="clear"
        [routerLink]="['/appointments/detail', item.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        *ngIf="canEditAppointment(item)"
        slot="end"
        fill="clear"
        color="warning"
        (click)="editAppointment(item.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

      <!-- Confirmar -->
      <ion-button
        *ngIf="canConfirmAppointment(item)"
        slot="end"
        fill="clear"
        color="success"
        (click)="confirmAppointment(item.id)"
      >
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </ion-button>

      <!-- Cancelar -->
      <ion-button
        *ngIf="canCancelAppointment(item)"
        slot="end"
        fill="clear"
        color="danger"
        (click)="cancelAppointment(item.id)"
      >
        <ion-icon name="close-circle-outline"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>


  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>

</ion-content>
