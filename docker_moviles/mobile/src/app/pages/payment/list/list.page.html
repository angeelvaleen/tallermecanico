<ion-header>
  <ion-toolbar>
    <ion-title>Pagos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let pay of payments">
      <ion-label>
        <h2>Monto: ${{ pay.amount }}</h2>
        <p>Referencia: {{ pay.reference || 'N/A' }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
