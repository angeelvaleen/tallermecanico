<app-toolbar name="Pagos" color="primary"></app-toolbar>

<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar servicio"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  <ion-list>
    <ion-item *ngFor="let payment of payments">
      <ion-label>
        <h2>Monto: ${{ payment.amount }}</h2>
        <p>Referencia: {{ payment.reference || 'N/A' }}</p>
      </ion-label>
      <ion-button [routerLink]="['/payment/detail',payment.id]" >
        <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
