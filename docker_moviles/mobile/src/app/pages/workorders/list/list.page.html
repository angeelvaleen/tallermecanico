<ion-header>
  <ion-toolbar>
    <ion-title>Ordenes de Trabajo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="createWorkorder()">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let workorder of workorders">
      <ion-label class="ion-text-wrap">
        <h2>Orden #{{ workorder.id }}</h2>
        <p>Kilometraje: {{ workorder.mileage }} km</p>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/workorders/detail', workorder.id]" >
          <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
      <ion-button slot="end" color="warning" (click)="abrirEditarModal(workorder.id)">
        <ion-icon name="pencil-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
