<ion-header>
  <ion-toolbar>
    <ion-title>
      Órdenes de Trabajo
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item
      *ngFor="let workorder of workorders"
    >

      <ion-label class="ion-text-wrap">

        <h2>
          Orden #{{ workorder.id }}
        </h2>

        <p>
          Kilometraje:
          {{ workorder.mileage }} km
        </p>

        <p>
          Estado:
          {{ getStatusName(workorder.status_id) }}
        </p>

      </ion-label>

      <!-- Detalle -->
      <ion-button
        slot="end"
        fill="clear"
        [routerLink]="[
          '/workorders/detail',
          workorder.id
        ]"
      >
        <ion-icon
          name="eye-outline"
        ></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        (click)="editWorkorder(workorder.id)"
      >
        <ion-icon
          name="pencil"
        ></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>


  <ion-fab
    slot="fixed"
    vertical="bottom"
    horizontal="center"
  >

    <ion-fab-button
      (click)="createWorkorder()"
    >
      <ion-icon
        name="add"
      ></ion-icon>
    </ion-fab-button>

  </ion-fab>

</ion-content>
