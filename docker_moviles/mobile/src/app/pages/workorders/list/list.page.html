<ion-header>
  <ion-toolbar>
    <ion-title>Ordenes de Trabajo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let w of workorders">
      <ion-label>
        <h2>Orden #{{ w.id }}</h2>
        <p>Kilometraje: {{ w.mileage }} km</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
