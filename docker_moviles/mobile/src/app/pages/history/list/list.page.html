<app-toolbar name="Historial" color="dark"></app-toolbar>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let h of history">
      <ion-label>
        <h2>Vehiculo ID: {{ h.vehicle_id }}</h2>
        <p>Orden ID: {{ h.workorder_id }}</p>
      </ion-label>
      <ion-button [routerLink]="['/history/detail', h.id]">
        <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
