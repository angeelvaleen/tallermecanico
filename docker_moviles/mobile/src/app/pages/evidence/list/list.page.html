<ion-header>
  <ion-toolbar>
    <ion-title>Evidencias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let evidence of evidences">
      <ion-label>
        <h2>Formato: {{ evidence.format }}</h2>
        <p>{{ evidence.path }}</p>
        <ion-button [routerLink]="['/evidences/detail', evidence.id]">
          <ion-icon name="eye-outline"></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
