<ion-header>
  <ion-toolbar>
    <ion-title>Evidencias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let evidence of evidences">
      <ion-label class="ion-text-wrap">
        <h2>Formato: {{ evidence.format }}</h2>
        <p>{{ evidence.path }}</p>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/evidences/detail', evidence.id]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
