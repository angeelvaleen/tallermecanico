<ion-header>
  <ion-toolbar>
    <ion-title>Evidencias</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let e of evidenceList">
      <ion-label>
        <h2>Formato: {{ e.format }}</h2>
        <p>{{ e.path }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
