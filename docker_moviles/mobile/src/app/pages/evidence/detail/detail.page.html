<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/evidences/list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Evidencia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-text color="danger" *ngIf="messageError">
    <p class="ion-padding">{{ messageError }}</p>
  </ion-text>

  <ion-card *ngIf="evidence">
    <ion-card-content>
        <h2>Orden de Trabajo ID: {{ evidence.workorder_id }}</h2>
        <p><strong>Ruta:</strong> {{ evidence.path }}</p>
        <p><strong>Formato:</strong> {{ evidence.format }}</p>
        <p><strong>Tamaño:</strong> {{ evidence.size }} bytes</p>
        <p><strong>Registro:</strong> {{ evidence.created_at | date:'yyyy-MM-dd' }}</p>
    </ion-card-content>
  </ion-card>
</ion-content>
