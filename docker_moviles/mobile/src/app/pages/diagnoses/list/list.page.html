<ion-header>
  <ion-toolbar>
    <ion-title>Diagnosticos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let diagnosis of diagnoses">
      <ion-label>
        <h2>Orden #{{ diagnosis.workorder_id }}</h2>
        <p>Registrado: {{ diagnosis.created_at }}</p>
        <ion-button [routerLink]="['/diagnoses/detail', diagnosis.id]">
          <ion-icon name="eye-outline"></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
