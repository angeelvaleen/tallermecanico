<ion-header>
  <ion-toolbar>
    <ion-title>Diagnósticos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab slot="fixed" vertical="bottom" horizontal="center">
  <ion-fab-button (click)="createDiagnosis()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
  <ion-list>

    <ion-item *ngFor="let diagnosis of diagnoses">

      <ion-label>
        <h2>Orden #{{ diagnosis.workorder_id }}</h2>

        <p>
          {{ diagnosis.description }}
        </p>

        <p>
          Resultado:
          {{ diagnosis.result || 'Sin resultado' }}
        </p>

        <p>
          Registrado:
          {{ diagnosis.created_at | date:'yyyy-MM-dd' }}
        </p>
      </ion-label>

      <ion-button
        [routerLink]="['/diagnoses/detail', diagnosis.id]"
        fill="clear"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <ion-button
        fill="clear"
        (click)="editDiagnosis(diagnosis.id)"
      >
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
</ion-content>
