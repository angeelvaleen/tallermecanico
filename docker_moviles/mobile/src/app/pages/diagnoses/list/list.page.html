<ion-header>
  <ion-toolbar>
    <ion-title>Diagnosticos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let d of diagnoses">
      <ion-label>
        <h2>Orden #{{ d.workorder_id }}</h2>
        <p>{{ d.description }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
