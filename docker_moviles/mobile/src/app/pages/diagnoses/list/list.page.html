<ion-header>
  <ion-toolbar>
    <ion-title>Diagnosticos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab slot="fixed" vertical="bottom" horizontal="center">
    <ion-fab-button (click)="createDiagnosis()">
        <ion-icon name="add"></ion-icon>
    </ion-fab-button>
</ion-fab>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let diagnosis of diagnoses">
      <ion-label class="ion-text-wrap">
        <h2>Orden #{{ diagnosis.workorder_id }}</h2>
        <p>Registrado: {{ diagnosis.created_at }}</p>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/diagnoses/detail', diagnosis.id]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
      <ion-button slot="end" color="warning" (click)="abrirEditarModal(diagnosis.id)">
        <ion-icon name="pencil-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
