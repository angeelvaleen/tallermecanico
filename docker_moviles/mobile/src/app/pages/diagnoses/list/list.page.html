<app-toolbar name="Diagnosticos" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createDiagnosis()" aria-label="Nuevo diagnostico">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>

<ion-content>
  <ion-list>

    <ion-item *ngFor="let diagnosis of diagnoses">

      <ion-label>
        <h2>Orden #{{ diagnosis.workorder_id }}</h2>

        <p>
          {{ diagnosis.description }}
        </p>
      </ion-label>

      <ion-button
        [routerLink]="['/diagnoses/detail', diagnosis.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <ion-button
        color="tertiary"
        (click)="editDiagnosis(diagnosis.id)"
      >
        <ion-icon name="create-outline"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
</ion-content>
