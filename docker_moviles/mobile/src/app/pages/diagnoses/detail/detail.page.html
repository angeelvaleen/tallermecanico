<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        defaultHref="/diagnoses/list"
      ></ion-back-button>
    </ion-buttons>

    <ion-title>Detalle de Diagnóstico</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-text
    color="danger"
    *ngIf="messageError"
  >
    <p class="ion-padding">
      {{ messageError }}
    </p>
  </ion-text>

  <div *ngIf="diagnosis">

    <ion-card>
      <ion-card-content>

        <h2>
          Orden de Trabajo #{{ diagnosis.workorder_id }}
        </h2>

        <p>
          <strong>Descripción:</strong>
          {{ diagnosis.description }}
        </p>

        <p>
          <strong>Resultado:</strong>
          {{ diagnosis.result || 'Sin resultado' }}
        </p>

        <p>
          <strong>Registro:</strong>
          {{ diagnosis.created_at | date:'yyyy-MM-dd' }}
        </p>

        <ion-button
          expand="block"
          (click)="editDiagnosis()"
        >
          <ion-icon
            slot="start"
            name="create-outline"
          ></ion-icon>

          Editar diagnóstico
        </ion-button>

      </ion-card-content>
    </ion-card>

  </div>

  <div
    *ngIf="!diagnosis && !messageError"
    class="ion-text-center"
  >
    <p>Cargando información...</p>
  </div>

</ion-content>
