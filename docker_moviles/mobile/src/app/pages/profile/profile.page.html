<app-toolbar name="Mi perfil" color="primary"></app-toolbar>

<ion-content [fullscreen]="true">
  <ion-spinner
    *ngIf="loading"
    name="crescent"
    class="ion-padding"
  ></ion-spinner>

  <form
    *ngIf="!loading && profile && profileForm"
    [formGroup]="profileForm"
    (ngSubmit)="saveProfile()"
  >
    <div class="profile-photo ion-text-center ion-padding">
      <ion-avatar class="profile-photo__image">
        <img
          *ngIf="avatarUrl"
          [src]="avatarUrl"
          alt="Fotografía de perfil"
        >
        <ion-icon
          *ngIf="!avatarUrl"
          name="person-outline"
        ></ion-icon>
      </ion-avatar>

      <ng-container *ngIf="canUploadPhoto">
        <input
          #fileInput
          type="file"
          accept="image/jpeg,image/png,image/webp"
          hidden
          (change)="onFileSelected($event)"
        >

        <ion-button
          fill="outline"
          size="small"
          type="button"
          (click)="fileInput.click()"
        >
          {{ avatarUrl ? 'Cambiar foto' : 'Subir foto' }}
        </ion-button>
      </ng-container>

      <ion-button
        *ngIf="avatarUrl"
        fill="clear"
        size="small"
        color="medium"
        type="button"
        (click)="removeAvatar()"
      >
        Quitar foto
      </ion-button>
    </div>

    <ion-list>
      <ion-item>
        <ion-input
          label="Nombre"
          labelPlacement="stacked"
          type="text"
          formControlName="first_name"
        ></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('first_name') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-input
          label="Apellido"
          labelPlacement="stacked"
          type="text"
          formControlName="last_name"
        ></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('last_name') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-textarea
          label="Descripción (opcional)"
          labelPlacement="stacked"
          formControlName="description"
          [autoGrow]="true"
          maxlength="500"
        ></ion-textarea>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('description') as error">
        {{ error }}
      </ion-note>

      <ion-item>
        <ion-label>
          <p>Correo</p>
          <h2>{{ profile.email }}</h2>
        </ion-label>
      </ion-item>

      <ion-item>
        <ion-label>
          <p>Rol</p>
          <h2>{{ profile.role?.name ?? 'Sin rol' }}</h2>
        </ion-label>
      </ion-item>
    </ion-list>

    <ion-note
      color="danger"
      class="ion-padding"
      *ngIf="errorMessage"
    >
      {{ errorMessage }}
    </ion-note>

    <ion-note
      color="success"
      class="ion-padding"
      *ngIf="successMessage"
    >
      {{ successMessage }}
    </ion-note>

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin"
      [disabled]="saving"
    >
      {{ saving ? 'Guardando...' : 'Guardar cambios' }}
    </ion-button>

    <ion-button
      *ngIf="isAdmin"
      expand="block"
      class="ion-margin"
      routerLink="/users/list"
    >
      Gestionar usuarios
    </ion-button>

    <ion-button
      expand="block"
      color="danger"
      class="ion-margin"
      type="button"
      (click)="logout()"
    >
      Cerrar sesión
    </ion-button>
  </form>
</ion-content>
