<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of brands">
      <ion-label class="ion-text-wrap">
        <h2>{{ item.name }}</h2>
        <p>Estado: {{ item.is_active ? 'Activo' : 'Inactivo' }}</p>
        <p>Registro: {{ item.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-label>
      <!-- Cambiamos routerLink por (click) para evitar el bloqueo de foco -->
      <ion-button slot="end" (click)="verDetalle(item.id, $event)">
        <ion-icon slot="start" name="eye-outline"></ion-icon>
        Ver detalle
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
