<ion-header>
  <ion-toolbar>
    <ion-title>Marcas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let brand of brands">
      <ion-label class="ion-text-wrap">
        <h2>{{ brand.name }}</h2>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/brands/detail', brand.id]">
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
