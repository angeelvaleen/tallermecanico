<app-toolbar name="Marcas" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createBrand()" aria-label="Nueva marca">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>

<ion-content>
   <ion-searchbar [value]="search" [debounce]="300" (ionInput)="handleInput($event)" placeholder="Buscar marcas" aria-label="Buscar marcas"></ion-searchbar>
    <p class="ion-padding" *ngIf="total === 0">No se encontraron marcas.</p>
  <ion-list>
    <ion-item *ngFor="let brand of brands">
      <ion-label class="ion-text-wrap">
        <h2>{{ brand.name }}</h2>

        <p>
          Estado:
          {{ brand.is_active ? 'Activo' : 'Inactivo' }}
        </p>

      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editBrand(brand.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
    [total]="total"
    [perPage]="perPage"
    [currentPage]="currentPage"
    [maxVisiblePage]="5"
    (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
