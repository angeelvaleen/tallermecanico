<app-toolbar name="Marcas" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createBrand()" aria-label="Nuevo couta">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>


<ion-content>
  <ion-list>
    <ion-item *ngFor="let brand of brands">
      <ion-label class="ion-text-wrap">
        <h2>{{ brand.name }}</h2>

        <p>
          Estado:
          {{ brand.is_active ? 'Activo' : 'Inactivo' }}
        </p>

      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editBrand(brand.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
