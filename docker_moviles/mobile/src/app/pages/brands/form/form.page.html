<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="closeModal()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Nueva Marca</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form *ngIf="brandForm" [formGroup]="brandForm" (ngSubmit)="saveBrand()">
    <ion-list>
      <ion-item>
        <ion-input label="Nombre" labelPlacement="stacked" type="text" formControlName="name" maxlength="50"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="getError('name') as error">
        {{ error }}
      </ion-note>
    </ion-list>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="saved">
      {{ saved ? 'Guardando...' : 'Guardar' }}
    </ion-button>
  </form>
</ion-content>
