<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/parts/list"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalle de Refaccion</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div *ngIf="part">
    <ion-card>
      <ion-card-content>
        <h2>Nombre: {{ part.name }}</h2>
        <p><strong>Precio:</strong> ${{ part.price }}</p>
        <p><strong>Descripcion:</strong> {{ part.description || 'Sin descripcion' }}</p>
        <p><strong>Estado:</strong> {{ part.is_active ? 'Activo' : 'Inactivo' }}</p>
        <p><strong>Registro:</strong> {{ part.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-card-content>
    </ion-card>
  </div>
  <div *ngIf="!part" class="ion-text-center">
    <p>Cargando informacion...</p>
  </div>
</ion-content>
