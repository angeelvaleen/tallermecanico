<ion-header>
  <ion-toolbar>
    <ion-title>Refacciones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let part of parts">
      <ion-label class="ion-text-wrap">
        <h2>{{ part.name }}</h2>
        <p>Precio: ${{ part.price }}</p>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/parts/detail',part.id]">
          <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
