<app-toolbar name="Refacciones" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createPart()" aria-label="Nueva refacción">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>

<ion-content>

  <app-searchbar
    [value]="search"
    placeholder="Buscar refacción"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>

  <div class="list-state" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando refacciones...</p>
  </div>

  <div class="list-state" *ngIf="!loading && loadError">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p>No se pudieron cargar las refacciones.</p>
    <ion-button fill="outline" (click)="retry()">Reintentar</ion-button>
  </div>

  <div class="list-state" *ngIf="!loading && !loadError && parts.length === 0">
    <ion-icon name="cube-outline"></ion-icon>
    <p>
      {{ search ? 'No se encontraron refacciones para "' + search + '".' : 'No hay refacciones registradas.' }}
    </p>
  </div>

  <ion-list *ngIf="!loading && !loadError">

    <ion-item *ngFor="let part of parts">

      <ion-label class="ion-text-wrap">
        <h2>{{ part.name }}</h2>
      </ion-label>

      <!-- Detalle -->
      <ion-button
        slot="end"
        fill="clear"
        [routerLink]="['/parts/detail', part.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        (click)="editPart(part.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
  <app-pagination
  *ngIf="!loading && !loadError && parts.length > 0"
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>

</ion-content>
