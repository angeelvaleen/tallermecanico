<app-toolbar name="Refacciones" color="dark"></app-toolbar>

<ion-fab
  slot="fixed"
  vertical="bottom"
  horizontal="center"
>
  <ion-fab-button (click)="createPart()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>

  <app-searchbar
    [value]="search"
    placeholder="Buscar refaccion"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>

  <ion-list>

    <ion-item *ngFor="let part of parts">

      <ion-label>
        <h2>{{ part.name }}</h2>
      </ion-label>

      <!-- Detalle -->
      <ion-button
        slot="end"
        [routerLink]="['/parts/detail', part.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>

      <!-- Editar -->
      <ion-button
        slot="end"
        color="warning"
        (click)="editPart(part.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>

    </ion-item>

  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>

</ion-content>
