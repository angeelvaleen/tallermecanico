<ion-header>
  <ion-toolbar>
    <ion-title>Metodos de Pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let method of methods">
      <ion-label>
        <h2>{{ method.name }}</h2>
        <ion-button [routerLink]="['/methods/detail',method.id]">
          <ion-icon name="eye-outline" ></ion-icon>
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
