<ion-header>
  <ion-toolbar>
    <ion-title>Métodos de pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-fab
  slot="fixed"
  vertical="bottom"
  horizontal="center"
>
  <ion-fab-button (click)="createMethod()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let method of methods">
      <ion-label class="ion-text-wrap">
        <h2>{{ method.name }}</h2>

        <p>
          Estado:
          {{ method.is_active ? 'Activo' : 'Inactivo' }}
        </p>

        <p>
          Registro:
          {{ method.created_at | date:'yyyy-MM-dd' }}
        </p>
      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editMethod(method.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
