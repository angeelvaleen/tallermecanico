<app-toolbar name="Metodos de pago" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createMethod()" aria-label="Nuevo metodo">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>>


<ion-content>
  <ion-list>
    <ion-item *ngFor="let method of methods">
      <ion-label class="ion-text-wrap">
        <h2>{{ method.name }}</h2>

        <p>
          Estado:
          {{ method.is_active ? 'Activo' : 'Inactivo' }}
        </p>

        <p>
          Registro:
          {{ method.created_at | date:'yyyy-MM-dd' }}
        </p>
      </ion-label>

      <ion-button
        slot="end"
        color="warning"
        (click)="editMethod(method.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
