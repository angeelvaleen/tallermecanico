<ion-header>
  <ion-toolbar>
    <ion-title>Metodos de Pago</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let method of methods">
      <ion-label class="ion-text-wrap">
        <h2>{{ method.name }}</h2>
      </ion-label>
      <ion-button slot="end" [routerLink]="['/methods/detail',method.id]">
        <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
