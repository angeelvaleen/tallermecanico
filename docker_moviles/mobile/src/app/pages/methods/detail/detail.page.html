<app-toolbar name="Detalle de Método" color="primary">
  <ion-buttons slot="start">
    <ion-back-button defaultHref="/methods/list"></ion-back-button>
  </ion-buttons>
</app-toolbar>

<ion-content class="ion-padding">
  <ion-text color="danger" *ngIf="messageError">
    <p class="ion-padding">{{ messageError }}</p>
  </ion-text>


  <div *ngIf="method">
    <ion-card>
      <ion-card-content>
        <h2>Nombre: {{ method.name }}</h2>
        <p><strong>Estado:</strong> {{ method.is_active ? 'Activo' : 'Inactivo' }}</p>
        <p><strong>Registro:</strong> {{ method.created_at | date:'yyyy-MM-dd' }}</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
