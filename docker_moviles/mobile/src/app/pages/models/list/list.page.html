<ion-header>
  <ion-toolbar>
    <ion-title>Modelos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let model of models">
      <ion-label>
        <h2>{{ model.name }}</h2>
        <p>Marca ID: {{ model.brand_id }}</p>
      </ion-label>
      <ion-button [routerLink]="['/models/detail', model.id]">
          <ion-icon name="eye-outline" ></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
