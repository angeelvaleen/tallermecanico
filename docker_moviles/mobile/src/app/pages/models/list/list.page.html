<app-toolbar name="Modelos" color="primary">
  <ion-buttons slot="end">
    <ion-button fill="primary" (click)="createModel()" aria-label="Nuevo modelo">
      <ion-icon slot="icon-only" name="add"></ion-icon>
    </ion-button>
  </ion-buttons>
</app-toolbar>



<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar por nombre o marca"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>

  <div class="list-state" *ngIf="loading">
    <ion-spinner name="crescent" color="primary"></ion-spinner>
    <p>Cargando modelos...</p>
  </div>

  <div class="list-state" *ngIf="!loading && loadError">
    <ion-icon name="cloud-offline-outline"></ion-icon>
    <p>No se pudieron cargar los modelos.</p>
    <ion-button fill="outline" (click)="retry()">Reintentar</ion-button>
  </div>

  <div class="list-state" *ngIf="!loading && !loadError && models.length === 0">
    <ion-icon name="car-sport-outline"></ion-icon>
    <p>
      {{ search ? 'No se encontraron modelos para "' + search + '".' : 'No hay modelos registrados.' }}
    </p>
  </div>

  <ion-list *ngIf="!loading && !loadError">
    <ion-item *ngFor="let model of models">
      <ion-label class="ion-text-wrap">
        <h2>{{ model.name }}</h2>

        <p>
          Marca:
          {{ model.brand_id.name }}
        </p>

        <p>
          Estado:
          {{ model.is_active ? 'Activo' : 'Inactivo' }}
        </p>
      </ion-label>

      <!--<ion-button
        slot="end"
        [routerLink]="['/models/detail', model.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
      --->
      
      <ion-button
        slot="end"
        fill="clear"
        color="warning"
        (click)="editModel(model.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
  *ngIf="!loading && !loadError && models.length > 0"
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
