<app-toolbar name="Modelos" color="dark"></app-toolbar>

<ion-fab
  slot="fixed"
  vertical="bottom"
  horizontal="center"
>
  <ion-fab-button (click)="createModel()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ion-content>
  <app-searchbar
    [value]="search"
    placeholder="Buscar por nombre o marca"
    [debounce]="300"
    (changeText)="handleInput($event)">
  </app-searchbar>
  <ion-list>
    <ion-item *ngFor="let model of models">
      <ion-label class="ion-text-wrap">
        <h2>{{ model.name }}</h2>

        <p>
          Marca:
          {{ getBrandName(model.brand_id) }}
        </p>

        <p>
          Estado:
          {{ model.is_active ? 'Activo' : 'Inactivo' }}
        </p>
      </ion-label>

      <!--<ion-button
        slot="end"
        [routerLink]="['/models/detail', model.id]"
      >
        <ion-icon name="eye-outline"></ion-icon>
      </ion-button>
      --->
      
      <ion-button
        slot="end"
        color="warning"
        (click)="editModel(model.id)"
      >
        <ion-icon name="pencil"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>
  <app-pagination
  [total]="total"
  [perPage]="perPage"
  [currentPage]="currentPage"
  [maxVisiblePage]="5"
  (changePage)="changePage($event)"
  ></app-pagination>
</ion-content>
