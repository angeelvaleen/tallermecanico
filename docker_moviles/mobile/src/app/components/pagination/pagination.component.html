<div class="pagination" *ngIf="totalPages > 1">

  <ion-button fill="outline" color="primary" size="small" [disabled]="currentPage === 1" (click)="before()">
    Anterior
  </ion-button>

  <ion-button
    *ngFor="let page of pageVisibles"
    size="small"
    [fill]="page === currentPage ? 'solid' : 'outline'"
    color="primary"
    (click)="changerPage(page)">
    {{ page }}
  </ion-button>

  <ion-button fill="outline" color="primary" size="small" [disabled]="currentPage === totalPages" (click)="next()">
    Siguiente
  </ion-button>

</div>

<p class="information" *ngIf="total > 0">
  Página {{ currentPage }} de {{ totalPages }} · {{ total }} registros
</p>
