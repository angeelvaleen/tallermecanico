<div class="pagination" *ngIf="totalPages > 1">

  <ion-button fill="solid" size="small" [disabled]="currentPage === 1" (click)="before()">
    Anterior
  </ion-button>

  <ion-button *ngFor="let page of pageVisibles" size="small" fill="solid" [color]="page === currentPage ? 'primary' : 'medium'" (click)="changerPage(page)">
    {{ page }}
  </ion-button>

  <ion-button fill="solid" size="small" [disabled]="currentPage === totalPages" (click)="next()">
    Siguiente
  </ion-button>

</div>

<p class="information" *ngIf="total > 0">
  Página {{ currentPage }} de {{ totalPages }} · {{ total }} registros
</p>
