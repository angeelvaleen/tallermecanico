<ion-tabs>

  <ion-tab-bar slot="bottom">
    <ion-tab-button
      *ngFor="let tab of tabs"
      [attr.tab]="tab.tab"
      [href]="tab.href"
      [class.tab-active]="isActive(tab)"
    >
      <ion-icon [name]="tab.icon"></ion-icon>
      <ion-label>{{ tab.label }}</ion-label>
    </ion-tab-button>
  </ion-tab-bar>

</ion-tabs>
